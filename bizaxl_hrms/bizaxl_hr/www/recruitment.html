{% extends "bizaxl_hrms/templates/bizaxl_portal_base.html" %}

{% block title %}Recruitment | Bizaxl{% endblock %}

{% block bz_content %}
<section class="bz-page-head">
  <div>
    <span class="bz-badge bz-badge-navy"><i data-lucide="briefcase"></i> Hiring</span>
    <h2 class="bz-h2">Recruitment</h2>
    <p class="bz-body-sm bz-muted">Browse open roles and see the active hiring pipeline.</p>
  </div>
</section>

<section class="bz-card">
  <div class="bz-card-header"><div class="bz-card-title"><i data-lucide="briefcase"></i> Open Positions</div></div>
  <div id="jobs" class="bz-list"></div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var BZ = window.BizaxlPortal;
  if (!BZ || !BZ.api) return;
  var cont = document.getElementById("jobs");
  BZ.api("job_openings").then(function (rows) {
    cont.innerHTML = "";
    if (!rows || !rows.length) {
      cont.innerHTML = "<div class='bz-empty'><i data-lucide='briefcase'></i><div>No open positions right now</div></div>";
      return;
    }
    rows.forEach(function (j) {
      var row = document.createElement("div"); row.className = "bz-row";
      row.innerHTML =
        "<div class='bz-row-left'><div><div class='bz-strong'>" + BZ.esc(j.job_title) + "</div>" +
        "<div class='bz-caption'>" + BZ.esc(j.department || "") + (j.designation ? " · " + BZ.esc(j.designation) : "") + "</div></div></div>" +
        "<span class='bz-badge bz-badge-mint'>Open</span>";
      cont.appendChild(row);
    });
  }).catch(function(){});
});
</script>
{% endblock %}
