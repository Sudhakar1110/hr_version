{% extends "bizaxl_hrms/templates/bizaxl_portal_base.html" %}

{% block title %}My Team | Bizaxl{% endblock %}

{% block bz_content %}
<section class="bz-page-head">
  <div>
    <span class="bz-badge bz-badge-navy"><i data-lucide="users"></i> Leadership</span>
    <h2 class="bz-h2">My Team</h2>
    <p class="bz-body-sm bz-muted">People who report to you, with upcoming team leave.</p>
  </div>
</section>

<section class="bz-grid bz-grid-2">
  <div class="bz-card">
    <div class="bz-card-header"><div class="bz-card-title"><i data-lucide="contact"></i> Direct Reports</div></div>
    <div id="team-list" class="bz-list"></div>
  </div>
  <div class="bz-card">
    <div class="bz-card-header"><div class="bz-card-title"><i data-lucide="calendar-days"></i> Team Leave</div></div>
    <div id="team-leave" class="bz-list"></div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var BZ = window.BizaxlPortal;
  if (!BZ || !BZ.api) return;

  BZ.api("my_team").then(function (rows) {
    var cont = document.getElementById("team-list");
    if (!rows || !rows.length) {
      cont.innerHTML = "<div class='bz-empty'><i data-lucide='users'></i><div>No direct reports yet</div></div>";
      return;
    }
    rows.forEach(function (e) {
      var row = document.createElement("div"); row.className = "bz-row";
      row.innerHTML =
        "<div class='bz-row-left'><span class='bz-avatar'>" + BZ.initials(e.employee_name) + "</span>" +
        "<div><div class='bz-strong'>" + BZ.esc(e.employee_name) + "</div>" +
        "<div class='bz-caption'>" + BZ.esc(e.designation || e.department || "Member") + "</div></div></div>";
      cont.appendChild(row);
    });
  }).catch(function(){});

  BZ.api("team_leave_calendar").then(function (rows) {
    var cont = document.getElementById("team-leave");
    if (!rows || !rows.length) {
      cont.innerHTML = "<div class='bz-empty'><i data-lucide='calendar-days'></i><div>No approved leave from the team this month</div></div>";
      return;
    }
    rows.forEach(function (r) {
      var row = document.createElement("div"); row.className = "bz-row";
      row.innerHTML = "<div class='bz-row-left'><div class='bz-strong'>" + BZ.esc(r.employee_name || r.employee) + "</div>" +
        "<div class='bz-caption'>" + BZ.esc(r.leave_type) + " · " + BZ.esc(r.from_date) + " &rarr; " + BZ.esc(r.to_date) + "</div></div>" +
        "<span class='bz-badge bz-badge-blue'>" + BZ.esc(r.total_leave_days) + "d</span>";
      cont.appendChild(row);
    });
  }).catch(function(){});
});
</script>
{% endblock %}
